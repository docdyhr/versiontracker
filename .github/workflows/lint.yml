---
name: Code Linting and Formatting

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  lint:
    name: Code Linting and Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        uses: ./.github/actions/setup-python-deps

      # pip ignores a constraint for any package the install above doesn't pull in (sphinx, tox,
      # virtualenv, pre-commit), so resolve the whole file on its own, for the declared floor
      # (requires-python >=3.12) and the newest CI Python. This required check is what keeps
      # dependabot-auto-merge.yml from landing a floor that doesn't exist, conflicts, or drops 3.12.
      - name: Check constraints.txt resolves
        run: |
          for py in 3.12 3.13; do
            echo "Resolving constraints.txt for Python $py"
            python -m pip install --dry-run --quiet --ignore-installed \
              --python-version "$py" --only-binary=:all: -r constraints.txt
          done

      # Dependabot bumps ruff's requirement pins but never the pre-commit hook's rev. Running the
      # parity test in this required check keeps a ruff bump PR from merging until every pin moves.
      - name: Check ruff pins agree
        run: python -m pytest tests/test_tool_pin_parity.py --no-cov -p no:cacheprovider

      - name: Run Ruff linting
        run: |
          echo "::group::Ruff Check"
          ruff check . --output-format=github
          echo "::endgroup::"

          echo "::group::Ruff Format Check"
          ruff format --check .
          echo "::endgroup::"

      - name: Run type checking
        run: |
          echo "::group::MyPy Type Checking"
          mypy versiontracker \
            --config-file=pyproject.toml \
            --ignore-missing-imports \
            --junit-xml=mypy-report.xml
          echo "::endgroup::"

      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            mypy-report.xml
          retention-days: 14
