# .github/workflows/dependabot-auto-merge.yml
#
# Native patch-bump auto-merge for Dependabot PRs — no AI required.
# The same workflow as httpcheck's and malwarespotter's, plus a ruff exclusion.
#
# Replaces the dispatch-only caller of the Claude merger in docdyhr/.github,
# which the org retired on 2026-10-21. Minor and major bumps still need review.
#
# Prerequisites:
#   - "Allow auto-merge" must be enabled in Settings → General → Pull Requests.
#   - Required CI checks must pass before the PR can merge (the main ruleset).
#
# Behaviour:
#   - patch bump        → approve + enable auto-merge (merges when CI passes)
#   - touches ruff      → skipped: compare `ruff check --statistics` with main
#                         first (CLAUDE.md), since a ruff patch release can
#                         change its default rules
#   - minor/major bump  → skipped here; requires review
#
# Requirement-range updates (constraints.txt `>=a,<b`): fetch-metadata reads
# previous-version from the range string (`10.0.0,>=9.1.0`) and reports
# semver-major even for a patch, so the level is derived from the PR title's
# old and new ranges instead. A changed upper bound counts as major. The
# required checks install with `-c constraints.txt` (setup-python-deps), and
# the required lint job resolves the whole file (lint.yml), so a range that
# doesn't resolve fails them and auto-merge never lands it.

name: Dependabot Patch Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch bump
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Derive bump level
        id: level
        run: |
          level="$META_TYPE"
          if ! printf '%s' "$PREV" | grep -Eq '^[0-9]+(\.[0-9A-Za-z]+)*$'; then
            # Range update: compare the bounds in "update X requirement from <old> to <new>"
            level=""
            old=$(printf '%s' "$TITLE" | sed -nE 's/.* requirement from ([^ ]+) to ([^ ]+)( in .*)?$/\1/p')
            new=$(printf '%s' "$TITLE" | sed -nE 's/.* requirement from ([^ ]+) to ([^ ]+)( in .*)?$/\2/p')
            old_lo=$(printf '%s\n' "$old" | tr ',' '\n' | sed -n 's/^>=//p')
            new_lo=$(printf '%s\n' "$new" | tr ',' '\n' | sed -n 's/^>=//p')
            old_hi=$(printf '%s\n' "$old" | tr ',' '\n' | grep '^<' || true)
            new_hi=$(printf '%s\n' "$new" | tr ',' '\n' | grep '^<' || true)
            if [ -z "$old" ] || [ -z "$new" ]; then
              level=""
            elif [ "$old_hi" != "$new_hi" ]; then
              level="version-update:semver-major"
            elif [ -n "$old_lo" ] && [ -n "$new_lo" ] && [ "$old_lo" != "$new_lo" ]; then
              IFS=. read -r -a a <<< "$old_lo"
              IFS=. read -r -a b <<< "$new_lo"
              i=0
              while [ "$i" -lt 10 ] && [ "${a[$i]:-}" = "${b[$i]:-}" ]; do i=$((i + 1)); done
              case $i in
                0) level="version-update:semver-major" ;;
                1) level="version-update:semver-minor" ;;
                10) level="" ;;
                *) level="version-update:semver-patch" ;;
              esac
            fi
          fi
          echo "Bump level: ${level:-unknown} (fetch-metadata: $META_TYPE, previous: $PREV)"
          echo "update-type=$level" >> "$GITHUB_OUTPUT"
        env:
          META_TYPE: ${{ steps.meta.outputs.update-type }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          TITLE: ${{ github.event.pull_request.title }}

      - name: Approve patch bump
        if: steps.level.outputs.update-type == 'version-update:semver-patch' && !contains(steps.meta.outputs.dependency-names, 'ruff')
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        continue-on-error: true

      - name: Enable auto-merge for patch bump
        if: steps.level.outputs.update-type == 'version-update:semver-patch' && !contains(steps.meta.outputs.dependency-names, 'ruff')
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge enabled for: $PR_NUMBER ($UPDATE_TYPE)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.level.outputs.update-type }}

      - name: Report skipped PR
        if: steps.level.outputs.update-type != 'version-update:semver-patch' || contains(steps.meta.outputs.dependency-names, 'ruff')
        run: |
          echo "Skipping (type=${UPDATE_TYPE:-unknown}, deps=$DEPS) — requires review."
        env:
          UPDATE_TYPE: ${{ steps.level.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
